<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">WORK productivity setup</title>
  <desc id="description">Four virtual desktops named Plan, Work, Meet, and Play use the same FancyZones layout: a narrow left zone, a wide right zone, and a full-screen zone overlapping both. Mouse back and forward buttons switch desktops. Ctrl plus Alt plus Page Up or Page Down, or Ctrl plus Alt plus mouse wheel, cycles windows within one zone. The complete setup requires PowerToys FancyZones and X-Mouse Button Control.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#64748b"/>
    </marker>
    <g id="layout">
      <rect width="253" height="138" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <path d="M 8 1 H 69 V 137 H 8 Q 1 137 1 130 V 8 Q 1 1 8 1" fill="#dbeafe"/>
      <path d="M 69 1 H 245 Q 252 1 252 8 V 130 Q 252 137 245 137 H 69 Z" fill="#ccfbf1"/>
      <line x1="69" y1="1" x2="69" y2="137" stroke="#94a3b8"/>
      <rect x="5" y="5" width="243" height="128" rx="5" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="35" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Left</text>
      <text x="161" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Right</text>
      <rect x="15" y="57" width="37" height="49" rx="4" fill="#93c5fd" stroke="#3b82f6"/>
      <rect x="21" y="65" width="37" height="49" rx="4" fill="#ffffff" stroke="#3b82f6"/>
      <line x1="25" y1="73" x2="54" y2="73" stroke="#bfdbfe" stroke-width="3"/>
      <rect x="90" y="49" width="133" height="61" rx="4" fill="#5eead4" stroke="#0d9488"/>
      <rect x="100" y="59" width="133" height="61" rx="4" fill="#ffffff" stroke="#0d9488"/>
      <line x1="105" y1="68" x2="228" y2="68" stroke="#99f6e4" stroke-width="3"/>
      <line x1="109" y1="83" x2="189" y2="83" stroke="#e2e8f0" stroke-width="4"/>
      <line x1="109" y1="94" x2="213" y2="94" stroke="#e2e8f0" stroke-width="4"/>
    </g>
  </defs>

  <rect width="1280" height="720" rx="20" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">WORK productivity setup</text>
    <text x="40" y="83" font-size="17" fill="#475569">Four workspaces. The same custom FancyZones layout on every monitor and desktop.</text>

    <g transform="translate(40 112)">
      <rect width="285" height="224" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="27" cy="28" r="5" fill="#3b82f6"/>
      <text x="43" y="36" font-size="24" font-weight="700" fill="#0f172a">Plan</text>
      <use href="#layout" x="16" y="56"/>
      <text x="142" y="214" text-anchor="middle" font-size="13" fill="#64748b">Same zones, different windows</text>
    </g>
    <g transform="translate(345 112)">
      <rect width="285" height="224" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="27" cy="28" r="5" fill="#0d9488"/>
      <text x="43" y="36" font-size="24" font-weight="700" fill="#0f172a">Work</text>
      <use href="#layout" x="16" y="56"/>
      <text x="142" y="214" text-anchor="middle" font-size="13" fill="#64748b">Same zones, different windows</text>
    </g>
    <g transform="translate(650 112)">
      <rect width="285" height="224" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="27" cy="28" r="5" fill="#8b5cf6"/>
      <text x="43" y="36" font-size="24" font-weight="700" fill="#0f172a">Meet</text>
      <use href="#layout" x="16" y="56"/>
      <text x="142" y="214" text-anchor="middle" font-size="13" fill="#64748b">Same zones, different windows</text>
    </g>
    <g transform="translate(955 112)">
      <rect width="285" height="224" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="27" cy="28" r="5" fill="#f59e0b"/>
      <text x="43" y="36" font-size="24" font-weight="700" fill="#0f172a">Play</text>
      <use href="#layout" x="16" y="56"/>
      <text x="142" y="214" text-anchor="middle" font-size="13" fill="#64748b">Same zones, different windows</text>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M 182 359 H 487"/>
      <path d="M 487 359 H 792"/>
      <path d="M 792 359 H 1097"/>
    </g>
    <text x="640" y="389" text-anchor="middle" font-size="15" fill="#475569">Mouse side buttons move between virtual desktops</text>

    <rect x="40" y="420" width="425" height="218" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="64" y="455" font-size="21" font-weight="700" fill="#0f172a">Switch desktops</text>
    <rect x="64" y="478" width="377" height="50" rx="8" fill="#eff6ff"/>
    <text x="252" y="509" text-anchor="middle" font-size="18" font-weight="600" fill="#1d4ed8">Mouse back / forward buttons</text>
    <text x="64" y="559" font-size="16" fill="#334155">Previous / next workspace</text>
    <text x="64" y="589" font-size="15" fill="#64748b">Requires X-Mouse Button Control</text>
    <text x="64" y="615" font-size="15" fill="#64748b">with the saved mouse mappings applied</text>

    <rect x="485" y="420" width="755" height="218" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="509" y="455" font-size="21" font-weight="700" fill="#0f172a">Cycle windows within the same FancyZones zone</text>
    <rect x="509" y="478" width="342" height="50" rx="8" fill="#f0fdfa"/>
    <text x="680" y="509" text-anchor="middle" font-size="18" font-weight="600" fill="#0f766e">Ctrl + Alt + PgUp / PgDn</text>
    <text x="868" y="509" text-anchor="middle" font-size="16" fill="#64748b">or</text>
    <rect x="886" y="478" width="330" height="50" rx="8" fill="#f0fdfa"/>
    <text x="1051" y="509" text-anchor="middle" font-size="18" font-weight="600" fill="#0f766e">Ctrl + Alt + scroll up / down</text>
    <text x="509" y="559" font-size="16" fill="#334155">Bring another window in that zone into focus</text>
    <text x="509" y="589" font-size="15" fill="#64748b">Keyboard: PowerToys FancyZones</text>
    <text x="509" y="615" font-size="15" fill="#64748b">Mouse wheel: FancyZones + X-Mouse Button Control</text>

    <line x1="40" y1="670" x2="80" y2="670" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="91" y="676" font-size="15" fill="#475569">Dashed outline = full-screen zone overlapping both side zones</text>
    <text x="1240" y="704" text-anchor="end" font-size="13" fill="#64748b">Complete setup: WORK + CONFIGURE_AND_INSTALL</text>
  </g>
</svg>
